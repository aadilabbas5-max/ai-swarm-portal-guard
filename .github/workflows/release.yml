name: 🚀 Swarm Platform CI Bundle Automation V1

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-package:
    name: 🤖 Headless VSIX Compilation Sweep
    runs-on: ubuntu-latest

    steps:
      - name: 🛰️ Fetch Source Repository Tracks
        uses: actions/checkout@v4

      - name: 🟢 Mount Stable Node.js Environment Engine
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 Ingest Project Core Dependencies
        run: |
          npm init -y
          npm install
          npm install -g @vscode/vsce

      - name: ⚙️ Strip Publisher Validation Constraints
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete pkg.publisher;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: ⚡ Execute Automated VSIX Package Binary Bundle
        run: vsce package --no-dependencies --no-validate --allow-missing-repository

      - name: 💾 Archive Compiled VSIX Binary Artifact to Cloud Storage
        uses: actions/upload-artifact@v4
        with:
          name: swarm-anti-hallucination-portal-package
          path: "*.vsix"
          if-no-files-found: error
